name: Sync Behance portfolio

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: behance-portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Synchronize public Behance projects
        run: python3 scripts/sync_behance.py

      - name: Commit updated project data
        run: |
          if git diff --quiet -- behance-projects.json; then
            echo "Behance project data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add behance-projects.json
          git commit -m "Sync projects from Behance"
          git push origin HEAD:main
